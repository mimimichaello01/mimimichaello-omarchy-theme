# Mimimichaello ATLAS — carbon surfaces with a restrained signal accent.
mode = "dark"

# Interface roles
accent      = "#ff5a12"
accent_text = "#100e0c"
attention   = "#f0a202"
selection            = "#2a160c"
selection_background = "#2a160c"
selection_foreground = "#f2ebe0"
muted                = "#3a342c"

# Carbon surface ramp
background         = "#100e0c"
dark_background    = "#0b0908"
darker_background  = "#080706"
lighter_background = "#1c1814"

# Ivory text ramp
foreground        = "#d6cfc4"
dark_foreground   = "#a69b8c"
light_foreground  = "#e7e0d5"
bright_foreground = "#f2ebe0"

# ANSI and diagnostic palette
red     = "#c22e16"
green   = "#8a9a4a"
yellow  = "#f0a202"
blue    = "#6a8aa0"
magenta = "#a03c2a"
cyan    = "#6f9a92"
orange  = "#ff5a12"
brown   = "#a05a36"

bright_red     = "#e84528"
bright_green   = "#a8b85c"
bright_yellow  = "#ffb020"
bright_blue    = "#8aa8bc"
bright_magenta = "#c45438"
bright_cyan    = "#8fb8b0"

# Positional aliases for consumers that still read ANSI slots directly.
color0  = "#100e0c"
color1  = "#c22e16"
color2  = "#8a9a4a"
color3  = "#f0a202"
color4  = "#6a8aa0"
color5  = "#a03c2a"
color6  = "#6f9a92"
color7  = "#d6cfc4"
color8  = "#3a342c"
color9  = "#e84528"
color10 = "#a8b85c"
color11 = "#ffb020"
color12 = "#8aa8bc"
color13 = "#c45438"
color14 = "#8fb8b0"
color15 = "#f2ebe0"

# Window focus remains visible without turning every surface orange.
hyprland_active_border   = "rgba(ff5a12cc)"
hyprland_inactive_border = "rgba(3a342c66)"
